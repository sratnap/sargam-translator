<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sargam Translator</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0e0c0a;--surface:#1a1713;--border:#2e2a24;--gold:#c9a84c;
      --gold-dim:#7a6330;--cream:#f0e6d0;--muted:#7a7060;--error:#c0574a;
      --blue:#8fbcda;--amber:#c48a6a;
    }
    body{background:var(--bg);color:var(--cream);font-family:'DM Mono',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:60px 24px 80px;}
    .top-rule{width:100%;max-width:560px;display:flex;align-items:center;gap:12px;margin-bottom:40px;}
    .top-rule span{flex:1;height:1px;background:var(--border);}
    .top-rule .diamond{width:8px;height:8px;background:var(--gold);transform:rotate(45deg);flex-shrink:0;}
    header{text-align:center;margin-bottom:56px;}
    header h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,6vw,3.2rem);font-weight:700;color:var(--cream);line-height:1.1;}
    header h1 em{font-style:italic;color:var(--gold);}
    header p{margin-top:14px;font-size:0.78rem;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;}
    .card{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:36px 36px 32px;}
    .label{font-size:0.68rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:10px;}
    .sa-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px;}
    .sa-btn{padding:7px 14px;background:transparent;border:1px solid var(--border);border-radius:2px;color:var(--muted);font-family:'DM Mono',monospace;font-size:0.82rem;cursor:pointer;transition:all 0.15s ease;}
    .sa-btn:hover{border-color:var(--gold-dim);color:var(--cream);}
    .sa-btn.active{background:var(--gold);border-color:var(--gold);color:#0e0c0a;font-weight:500;}
    .mode-row{display:flex;gap:8px;margin-bottom:20px;}
    .mode-btn{flex:1;padding:9px;background:transparent;border:1px solid var(--border);border-radius:2px;color:var(--muted);font-family:'DM Mono',monospace;font-size:0.78rem;cursor:pointer;transition:all 0.15s ease;letter-spacing:0.08em;}
    .mode-btn:hover{border-color:var(--gold-dim);color:var(--cream);}
    .mode-btn.active{border-color:var(--gold-dim);color:var(--cream);background:rgba(201,168,76,0.07);}
    .upload-zone{border:1px dashed var(--border);border-radius:3px;padding:36px 24px;text-align:center;cursor:pointer;transition:all 0.2s ease;margin-bottom:24px;position:relative;}
    .upload-zone:hover,.upload-zone.drag-over{border-color:var(--gold-dim);background:rgba(201,168,76,0.04);}
    .upload-zone input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
    .upload-icon{font-size:1.8rem;margin-bottom:10px;opacity:0.5;}
    .upload-zone p{font-size:0.78rem;color:var(--muted);line-height:1.6;}
    .upload-zone .filename{margin-top:10px;font-size:0.8rem;color:var(--gold);}
    .record-zone{border:1px dashed var(--border);border-radius:3px;padding:36px 24px;text-align:center;margin-bottom:24px;display:none;}
    .record-zone.active-mode{display:block;}
    .record-btn{width:64px;height:64px;border-radius:50%;border:2px solid var(--border);background:transparent;color:var(--muted);font-size:1.6rem;cursor:pointer;transition:all 0.2s ease;margin-bottom:12px;}
    .record-btn:hover{border-color:var(--error);color:var(--error);}
    .record-btn.recording{border-color:var(--error);background:rgba(192,87,74,0.15);color:var(--error);animation:pulse 1s ease-in-out infinite;}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(192,87,74,0.4);}50%{box-shadow:0 0 0 8px rgba(192,87,74,0);}}
    .record-status{font-size:0.78rem;color:var(--muted);}
    .record-status.recording{color:var(--error);}
    .record-timer{font-size:1rem;color:var(--cream);margin-top:8px;display:none;}
    .record-timer.visible{display:block;}
    .translate-btn{width:100%;padding:14px;background:var(--gold);border:none;border-radius:2px;color:#0e0c0a;font-family:'DM Mono',monospace;font-size:0.82rem;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer;transition:all 0.15s ease;}
    .translate-btn:hover{background:#d4b45a;}
    .translate-btn:disabled{background:var(--border);color:var(--muted);cursor:not-allowed;}
    .spinner{display:none;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto;}
    .spinner.active{display:block;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .error-msg{display:none;margin-top:16px;padding:12px 16px;border:1px solid var(--error);border-radius:2px;color:var(--error);font-size:0.78rem;line-height:1.5;}
    .error-msg.visible{display:block;}
    .output-section{margin-top:36px;opacity:0;transform:translateY(12px);transition:all 0.4s ease;pointer-events:none;}
    .output-section.visible{opacity:1;transform:translateY(0);pointer-events:all;}
    .output-meta{display:flex;justify-content:space-between;font-size:0.7rem;color:var(--muted);letter-spacing:0.1em;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);}
    .output-meta b{color:var(--cream);}
    .audio-player{margin-bottom:20px;padding:12px 16px;border:1px solid var(--border);border-radius:3px;display:flex;align-items:center;gap:12px;}
    .play-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--gold-dim);background:transparent;color:var(--gold);font-size:0.9rem;cursor:pointer;transition:all 0.15s ease;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
    .play-btn:hover{background:rgba(201,168,76,0.1);}
    .progress-bar{flex:1;height:3px;background:var(--border);border-radius:2px;cursor:pointer;position:relative;}
    .progress-fill{height:100%;background:var(--gold);border-radius:2px;width:0%;pointer-events:none;}
    .time-display{font-size:0.7rem;color:var(--muted);flex-shrink:0;min-width:70px;text-align:right;}
    .sargam-output{font-family:'Playfair Display',serif;font-size:clamp(1.1rem,3vw,1.5rem);line-height:2.4;color:var(--cream);word-break:break-word;letter-spacing:0.04em;}
    .note-wrap{display:inline-block;padding:2px 4px;border-radius:3px;margin:0 2px;cursor:pointer;transition:all 0.15s ease;}
    .note-wrap:hover{background:rgba(255,255,255,0.06);}
    .note-shuddha{color:var(--cream);}
    .note-komal{color:var(--blue);}
    .note-tivra{color:var(--amber);}
    .note-sa{color:var(--gold);font-weight:700;}
    .note-pa{color:var(--gold);font-weight:700;}
    .note-wrap.active{background:rgba(201,168,76,0.18);outline:1px solid rgba(201,168,76,0.4);}
    .note-wrap.played{opacity:0.45;}
    .copy-btn{margin-top:20px;padding:8px 18px;background:transparent;border:1px solid var(--border);border-radius:2px;color:var(--muted);font-family:'DM Mono',monospace;font-size:0.72rem;letter-spacing:0.1em;cursor:pointer;transition:all 0.15s ease;}
    .copy-btn:hover{border-color:var(--gold-dim);color:var(--cream);}
    .bottom-rule{margin-top:52px;width:100%;max-width:560px;display:flex;align-items:center;gap:12px;}
    .bottom-rule span{flex:1;height:1px;background:var(--border);}
    .bottom-rule p{font-size:0.65rem;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;white-space:nowrap;}
  </style>
</head>
<body>
  <div class="top-rule"><span></span><div class="diamond"></div><span></span></div>
  <header>
    <h1>Sargam <em>Translator</em></h1>
    <p>Audio → Hindustani Notation</p>
  </header>
  <div class="card">
    <div class="label">Select Sa (Root Pitch)</div>
    <div class="sa-row" id="saRow"></div>
    <div class="label">Audio Input</div>
    <div class="mode-row">
      <button class="mode-btn active" id="modeUpload" onclick="setMode('upload')">↑ Upload File</button>
      <button class="mode-btn" id="modeRecord" onclick="setMode('record')">⏺ Record Live</button>
    </div>
    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept=".mp3,.wav,.m4a,.aac" />
      <div class="upload-icon">♩</div>
      <p>Click to choose a file, or drag one here<br/>MP3 · WAV · M4A · AAC &nbsp;|&nbsp; up to ~1 min</p>
      <div class="filename" id="fileName"></div>
    </div>
    <div class="record-zone" id="recordZone">
      <button class="record-btn" id="recordBtn" onclick="toggleRecording()">⏺</button>
      <div class="record-status" id="recordStatus">Press to start recording</div>
      <div class="record-timer" id="recordTimer">0:00</div>
    </div>
    <button class="translate-btn" id="translateBtn" disabled>Translate to Sargam</button>
    <div style="padding:16px 0 0;display:none" id="loadingRow"><div class="spinner active"></div></div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="output-section" id="outputSection">
      <div class="output-meta">
        <div>Sa: <b id="metaSa">—</b></div>
        <div>Notes: <b id="metaNotes">—</b></div>
        <div>Duration: <b id="metaDuration">—</b></div>
      </div>
      <div class="audio-player">
        <button class="play-btn" id="playBtn" onclick="togglePlayback()">▶</button>
        <div class="progress-bar" id="progressBar" onclick="seekAudio(event)">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
      </div>
      <div class="sargam-output" id="sargamOutput"></div>
      <button class="copy-btn" id="copyBtn">Copy Sargam</button>
    </div>
  </div>
  <div class="bottom-rule"><span></span><p>v2 — synchronized playback</p><span></span></div>
  <audio id="audioEl"></audio>
  <script>
    const NOTES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
    let selectedSa="C",selectedFile=null,recordedBlob=null,mediaRecorder=null;
    let recordingChunks=[],recordingTimer=null,recordingSeconds=0;
    let inputMode="upload",notesData=[],syncInterval=null,audioObjectURL=null;
    const audioEl=document.getElementById("audioEl");

    // Sa buttons
    const saRow=document.getElementById("saRow");
    NOTES.forEach(note=>{
      const btn=document.createElement("button");
      btn.className="sa-btn"+(note===selectedSa?" active":"");
      btn.textContent=note;
      btn.onclick=()=>{
        document.querySelectorAll(".sa-btn").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        selectedSa=note;
        updateTranslateBtn();
      };
      saRow.appendChild(btn);
    });

    // Mode toggle
    function setMode(mode){
      inputMode=mode;
      document.getElementById("modeUpload").classList.toggle("active",mode==="upload");
      document.getElementById("modeRecord").classList.toggle("active",mode==="record");
      document.getElementById("uploadZone").style.display=mode==="upload"?"block":"none";
      document.getElementById("recordZone").classList.toggle("active-mode",mode==="record");
      selectedFile=null;recordedBlob=null;
      document.getElementById("fileName").textContent="";
      updateTranslateBtn();
    }

    // File upload
    const fileInput=document.getElementById("fileInput");
    const uploadZone=document.getElementById("uploadZone");
    fileInput.addEventListener("change",()=>{if(fileInput.files[0])setFile(fileInput.files[0]);});
    uploadZone.addEventListener("dragover",e=>{e.preventDefault();uploadZone.classList.add("drag-over");});
    uploadZone.addEventListener("dragleave",()=>uploadZone.classList.remove("drag-over"));
    uploadZone.addEventListener("drop",e=>{e.preventDefault();uploadZone.classList.remove("drag-over");if(e.dataTransfer.files[0])setFile(e.dataTransfer.files[0]);});
    function setFile(f){selectedFile=f;recordedBlob=null;document.getElementById("fileName").textContent=f.name;updateTranslateBtn();}

    // Live recording
    async function toggleRecording(){
      if(mediaRecorder&&mediaRecorder.state==="recording"){stopRecording();}
      else{startRecording();}
    }
    async function startRecording(){
      try{
        const stream=await navigator.mediaDevices.getUserMedia({audio:true});
        recordingChunks=[];
        mediaRecorder=new MediaRecorder(stream);
        mediaRecorder.ondataavailable=e=>recordingChunks.push(e.data);
        mediaRecorder.onstop=()=>{
          recordedBlob=new Blob(recordingChunks,{type:"audio/wav"});
          selectedFile=null;updateTranslateBtn();
          document.getElementById("recordStatus").textContent="Recording saved — ready to translate";
          document.getElementById("recordStatus").classList.remove("recording");
        };
        mediaRecorder.start();
        document.getElementById("recordBtn").classList.add("recording");
        document.getElementById("recordBtn").textContent="⏹";
        document.getElementById("recordStatus").textContent="Recording...";
        document.getElementById("recordStatus").classList.add("recording");
        document.getElementById("recordTimer").classList.add("visible");
        recordingSeconds=0;
        recordingTimer=setInterval(()=>{
          recordingSeconds++;
          const m=Math.floor(recordingSeconds/60),s=recordingSeconds%60;
          document.getElementById("recordTimer").textContent=`${m}:${s.toString().padStart(2,"0")}`;
        },1000);
      }catch(err){
        document.getElementById("recordStatus").textContent="Microphone access denied — please allow microphone permission";
      }
    }
    function stopRecording(){
      if(mediaRecorder){mediaRecorder.stop();mediaRecorder.stream.getTracks().forEach(t=>t.stop());}
      clearInterval(recordingTimer);
      document.getElementById("recordBtn").classList.remove("recording");
      document.getElementById("recordBtn").textContent="⏺";
    }

    function updateTranslateBtn(){
      const hasAudio=inputMode==="upload"?!!selectedFile:!!recordedBlob;
      document.getElementById("translateBtn").disabled=!hasAudio;
    }

    // Translate
    document.getElementById("translateBtn").addEventListener("click",async()=>{
      const loadingRow=document.getElementById("loadingRow");
      const outputSection=document.getElementById("outputSection");
      const errorMsg=document.getElementById("errorMsg");
      loadingRow.style.display="block";
      outputSection.classList.remove("visible");
      errorMsg.classList.remove("visible");
      document.getElementById("translateBtn").disabled=true;
      stopSyncLoop();
      try{
        const formData=new FormData();
        if(inputMode==="upload"){formData.append("file",selectedFile);}
        else{formData.append("file",recordedBlob,"recording.wav");}
        formData.append("sa",selectedSa);
        const resp=await fetch("http://127.0.0.1:8000/translate",{method:"POST",body:formData});
        const data=await resp.json();
        if(data.error){errorMsg.textContent="Error: "+data.error;errorMsg.classList.add("visible");}
        else{setupAudio();renderOutput(data);}
      }catch(err){
        errorMsg.textContent="Could not reach the server. Make sure you ran: python -m uvicorn server:app --reload";
        errorMsg.classList.add("visible");
      }finally{
        loadingRow.style.display="none";updateTranslateBtn();
      }
    });

    // Audio setup
    function setupAudio(){
      if(audioObjectURL)URL.revokeObjectURL(audioObjectURL);
      const audioFile=inputMode==="upload"?selectedFile:recordedBlob;
      audioObjectURL=URL.createObjectURL(audioFile);
      audioEl.src=audioObjectURL;audioEl.load();
      audioEl.ontimeupdate=updateProgressBar;
      audioEl.onended=()=>{document.getElementById("playBtn").textContent="▶";stopSyncLoop();};
    }

    // Note colour
    function noteClass(note){
      const base=note.replace(/[.,]/g,"");
      if(base==="S")return "note-sa";
      if(base==="P")return "note-pa";
      if(base.includes("'"))return "note-tivra";
      if(base===base.toLowerCase())return "note-komal";
      return "note-shuddha";
    }

    // Render output
    function renderOutput(data){
      notesData=data.sargam;
      document.getElementById("metaSa").textContent=data.sa;
      document.getElementById("metaNotes").textContent=data.total_notes;
      document.getElementById("metaDuration").textContent=data.duration+"s";
      const container=document.getElementById("sargamOutput");
      container.innerHTML=notesData.map((item,i)=>
        `<span class="note-wrap ${noteClass(item.note)}" data-index="${i}" data-time="${item.time}" onclick="seekToNote(${item.time})">${item.note}</span>`
      ).join(" ");
      document.getElementById("outputSection").classList.add("visible");
    }

    // Playback controls
    function togglePlayback(){
      if(audioEl.paused){audioEl.play();document.getElementById("playBtn").textContent="⏸";startSyncLoop();}
      else{audioEl.pause();document.getElementById("playBtn").textContent="▶";stopSyncLoop();}
    }
    function seekAudio(e){
      const bar=document.getElementById("progressBar");
      audioEl.currentTime=(e.offsetX/bar.offsetWidth)*audioEl.duration;
      updateProgressBar();
    }
    function seekToNote(time){
      audioEl.currentTime=time;updateProgressBar();highlightAtTime(time);
    }
    function updateProgressBar(){
      if(!audioEl.duration)return;
      document.getElementById("progressFill").style.width=((audioEl.currentTime/audioEl.duration)*100)+"%";
      const fmt=t=>`${Math.floor(t/60)}:${Math.floor(t%60).toString().padStart(2,"0")}`;
      document.getElementById("timeDisplay").textContent=`${fmt(audioEl.currentTime)} / ${fmt(audioEl.duration)}`;
    }

    // Sync loop
    function startSyncLoop(){
      stopSyncLoop();
      syncInterval=setInterval(()=>highlightAtTime(audioEl.currentTime),80);
    }
    function stopSyncLoop(){if(syncInterval){clearInterval(syncInterval);syncInterval=null;}}
    function highlightAtTime(currentTime){
      if(!notesData.length)return;
      let activeIndex=-1;
      for(let i=0;i<notesData.length;i++){
        if(notesData[i].time<=currentTime)activeIndex=i;
        else break;
      }
      document.querySelectorAll(".note-wrap").forEach((el,i)=>{
        el.classList.remove("active","played");
        if(i===activeIndex){el.classList.add("active");el.scrollIntoView({behavior:"smooth",block:"nearest",inline:"nearest"});}
        else if(i<activeIndex){el.classList.add("played");}
      });
    }

    // Copy
    document.getElementById("copyBtn").addEventListener("click",()=>{
      const text=notesData.map(n=>n.note).join("  ");
      navigator.clipboard.writeText(text).then(()=>{
        const btn=document.getElementById("copyBtn");
        btn.textContent="Copied ✓";
        setTimeout(()=>btn.textContent="Copy Sargam",1800);
      });
    });
  </script>
</body>
</html>
